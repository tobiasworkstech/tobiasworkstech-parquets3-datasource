services:
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - grafana-net

  minio-setup:
    image: python:3.11-slim
    container_name: minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        pip install --no-cache-dir pandas pyarrow minio scikit-learn
        python3 << 'PYEOF'
        import pandas as pd
        import numpy as np
        from datetime import datetime, timedelta
        from minio import Minio
        import math

        client = Minio("minio:9000", access_key="minioadmin", secret_key="minioadmin123", secure=False)
        bucket = "parquet-data"
        if not client.bucket_exists(bucket):
            client.make_bucket(bucket)

        import os
        def upload(df, name):
            path = f'/tmp/{name}'
            os.makedirs(os.path.dirname(path), exist_ok=True)
            df.to_parquet(path, index=False)
            client.fput_object(bucket, name, path)
            print(f"Uploaded {name} ({len(df)} rows)")

        # --- 1. Iris dataset ---
        from sklearn.datasets import load_iris
        iris = load_iris()
        iris_df = pd.DataFrame(iris.data, columns=['sepal.length', 'sepal.width', 'petal.length', 'petal.width'])
        iris_df['variety'] = pd.Categorical.from_codes(iris.target, iris.target_names)
        upload(iris_df, 'iris.parquet')

        # --- 2. Titanic dataset ---
        np.random.seed(42)
        n = 891
        titanic_df = pd.DataFrame({
            'PassengerId': range(1, n + 1),
            'Survived': np.random.choice([0, 1], n, p=[0.616, 0.384]),
            'Pclass': np.random.choice([1, 2, 3], n, p=[0.242, 0.207, 0.551]),
            'Name': [f'Passenger_{i}' for i in range(1, n + 1)],
            'Sex': np.random.choice(['male', 'female'], n, p=[0.647, 0.353]),
            'Age': np.random.normal(29.7, 14.5, n).clip(0.5, 80).round(1),
            'SibSp': np.random.choice([0, 1, 2, 3, 4, 5], n, p=[0.68, 0.23, 0.03, 0.02, 0.02, 0.02]),
            'Parch': np.random.choice([0, 1, 2, 3, 4, 5], n, p=[0.76, 0.13, 0.06, 0.02, 0.02, 0.01]),
            'Fare': np.random.exponential(32, n).round(4),
            'Embarked': np.random.choice(['S', 'C', 'Q'], n, p=[0.724, 0.189, 0.087]),
        })
        upload(titanic_df, 'titanic.parquet')

        # --- 3. Metrics timeseries (2 days, 5-min intervals, 3 hosts) ---
        end_time = datetime.now()
        start_time = end_time - timedelta(days=2)
        interval = timedelta(minutes=5)
        num_points = int(timedelta(days=2) / interval)
        hosts = ['server-1', 'server-2', 'server-3']
        rows = []
        for host in hosts:
            base_cpu = 20.0 + np.random.random() * 30
            base_mem = 40.0 + np.random.random() * 20
            base_disk = 50.0 + np.random.random() * 20
            for i in range(num_points):
                t = start_time + i * interval
                hour = t.hour
                day_factor = 1.5 if 9 <= hour <= 17 else 1.0
                cpu = max(0, min(100, base_cpu * day_factor + math.sin(i / 100) * 10 + np.random.random() * 15))
                mem = max(0, min(100, base_mem + math.sin(i / 200) * 5 + np.random.random() * 10))
                disk = max(0, min(100, base_disk + i * 0.001 + np.random.random() * 2))
                net = max(0, 50 * day_factor + math.sin(i / 50) * 20 + np.random.random() * 30)
                reqs = max(0, int(100 * day_factor + np.random.random() * 200))
                errs = max(0, int(np.random.random() * 10 * (1.5 if cpu > 80 else 1.0)))
                rows.append([t, cpu, mem, disk, net, reqs, errs, host])
        ts_df = pd.DataFrame(rows, columns=['timestamp', 'cpu_percent', 'memory_percent', 'disk_percent',
                                             'network_mbps', 'requests', 'errors', 'host'])
        upload(ts_df, 'metrics_timeseries.parquet')

        # --- 4. Sample metrics (7 days, hourly, sensors) ---
        base_time = datetime.now() - timedelta(days=7)
        timestamps = [base_time + timedelta(hours=i) for i in range(168)]
        sample_df = pd.DataFrame({
            'timestamp': timestamps,
            'temperature': np.random.normal(25, 5, 168).round(2),
            'humidity': np.random.uniform(30, 80, 168).round(2),
            'pressure': np.random.normal(1013, 10, 168).round(2),
            'location': np.random.choice(['sensor_1', 'sensor_2', 'sensor_3'], 168),
            'status': np.random.choice(['normal', 'warning', 'critical'], 168, p=[0.8, 0.15, 0.05])
        })
        upload(sample_df, 'sample_metrics.parquet')

        # --- 5. Test dataset (simple) ---
        test_df = pd.DataFrame({
            'id': range(1, 101),
            'name': [f'item_{i}' for i in range(1, 101)],
            'value': np.random.uniform(0, 100, 100).round(2),
            'category': np.random.choice(['A', 'B', 'C', 'D'], 100),
            'timestamp': pd.date_range(start='2026-01-01', periods=100, freq='h'),
        })
        upload(test_df, 'test.parquet')

        print("\nAll datasets uploaded successfully!")
        PYEOF
    networks:
      - grafana-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: tobiasworkstech-parquets3-datasource
      GF_LOG_LEVEL: debug
    volumes:
      - grafana_data:/var/lib/grafana
      - ../dist:/var/lib/grafana/plugins/tobiasworkstech-parquets3-datasource:ro
      - ../provisioning:/etc/grafana/provisioning:ro
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - grafana-net

networks:
  grafana-net:
    driver: bridge

volumes:
  minio_data:
  grafana_data:
