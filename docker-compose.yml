services:
  grafana:
    build:
      context: .
      dockerfile: Dockerfile.grafana
    ports:
      - "3001:3000"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    depends_on:
      - minio
      - uploaddata

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  uploaddata:
    image: minio/mc:latest
    depends_on:
      - minio
    volumes:
      - ./samples:/data/samples:ro
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/parquet-data --ignore-existing;
      mc anonymous set download myminio/parquet-data;
      for f in /data/samples/*.parquet; do
        mc cp \$$f myminio/parquet-data/\$$(basename \$$f);
        echo \"Uploaded \$$(basename \$$f) to MinIO\";
      done;
      echo 'All parquet files uploaded:';
      mc ls myminio/parquet-data;
      exit 0;
      "
